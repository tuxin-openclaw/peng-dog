<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>小狗键鼠桌宠 · Web & Tauri 双端共享</title>
  <style>
    :root {
      --bg-page: #f4f7fc;
      --hud-bg: rgba(255, 255, 255, 0.86);
      --hud-border: rgba(140, 168, 204, 0.28);
      --hud-shadow: 0 10px 30px rgba(48, 76, 118, 0.12);
      --text-main: #2c3545;
      --text-muted: #69778c;
      --tab-active-bg: #3b82f6;
      --tab-active-text: #ffffff;
      --tab-hover-bg: rgba(59, 130, 246, 0.1);
      --treat-hover-bg: rgba(245, 158, 11, 0.15);
      --treat-active-bg: #f59e0b;
      --treat-active-text: #ffffff;
    }

    body.theme-dark {
      --bg-page: #151922;
      --hud-bg: rgba(28, 34, 46, 0.9);
      --hud-border: rgba(255, 255, 255, 0.12);
      --hud-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
      --text-main: #eef2f8;
      --text-muted: #9aa6ba;
      --tab-active-bg: #60a5fa;
      --tab-active-text: #101826;
      --tab-hover-bg: rgba(96, 165, 250, 0.15);
      --treat-hover-bg: rgba(251, 191, 36, 0.18);
      --treat-active-bg: #fbbf24;
      --treat-active-text: #1f1605;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-page);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
    }

    /* Tauri Desktop Pet Mode: 100% transparent frameless pet window */
    html.is-desktop-pet,
    body.is-desktop-pet {
      background: transparent !important;
    }

    body.is-desktop-pet .hud-top,
    body.is-desktop-pet .hud-bottom {
      display: none !important;
    }

    #petCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: default;
    }

    .hud-top {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: max-content;
      max-width: calc(100vw - 20px);
    }

    .char-switcher,
    .state-bar,
    .treat-bar,
    .hud-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px;
      border-radius: 999px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      box-shadow: var(--hud-shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .bar-label,
    .treat-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 6px 0 9px;
      white-space: nowrap;
    }

    .char-tab,
    .state-btn,
    .treat-btn,
    .hud-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-main);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
      white-space: nowrap;
    }

    .char-tab:hover,
    .state-btn:hover,
    .hud-btn:hover {
      background: var(--tab-hover-bg);
    }

    .treat-btn {
      cursor: grab;
    }

    .treat-btn:hover {
      background: var(--treat-hover-bg);
      transform: translateY(-1px);
    }

    .char-tab:active,
    .state-btn:active,
    .treat-btn:active,
    .hud-btn:active {
      transform: scale(0.95);
    }

    .char-tab.is-active,
    .state-btn.is-active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      box-shadow: 0 3px 10px rgba(59, 130, 246, 0.28);
    }

    .state-btn[data-state="happy"].is-active {
      background: #ec4899;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(236, 72, 153, 0.34);
    }

    .state-btn[data-state="drool"].is-active {
      background: #0ea5e9;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(14, 165, 233, 0.34);
    }

    .state-btn[data-state="sleepy"].is-active {
      background: #6366f1;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(99, 102, 241, 0.34);
    }

    .state-btn[data-state="overdrive"].is-active {
      background: #f97316;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(249, 115, 22, 0.36);
    }

    .treat-btn.is-active {
      background: var(--treat-active-bg);
      color: var(--treat-active-text);
      box-shadow: 0 3px 12px rgba(245, 158, 11, 0.36);
    }

    .hud-bottom {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      box-shadow: var(--hud-shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      max-width: calc(100vw - 24px);
      pointer-events: none;
    }

    .hud-bottom strong {
      color: var(--text-main);
      font-weight: 700;
    }

    .divider {
      width: 1px;
      height: 13px;
      background: var(--hud-border);
    }

    /* Shared Web Right-Click Dropdown Context Menu */
    .pet-context-menu {
      position: fixed;
      z-index: 50;
      min-width: 196px;
      padding: 6px;
      border-radius: 14px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      box-shadow: 0 14px 36px rgba(20, 32, 56, 0.2);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none;
      flex-direction: column;
      gap: 2px;
    }

    .pet-context-menu.is-open {
      display: flex;
    }

    .ctx-group-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 10px 2px;
    }

    .ctx-sep {
      height: 1px;
      margin: 4px 6px;
      background: var(--hud-border);
    }

    .ctx-item {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-main);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
    }

    .ctx-item:hover {
      background: var(--tab-hover-bg);
    }

    .ctx-check {
      font-size: 12px;
      color: var(--tab-active-bg);
      font-weight: 800;
    }

    @media (max-width: 860px) {
      .char-tab, .state-btn, .treat-btn, .hud-btn {
        font-size: 12px;
        padding: 5px 9px;
      }
      .bar-label,
      .treat-label {
        display: none;
      }
      .hud-bottom {
        font-size: 12px;
        padding: 6px 14px;
      }
    }
  </style>
</head>
<body class="theme-light">
  <header class="hud-top">
    <nav class="char-switcher" aria-label="切换小狗形象">
      <button type="button" class="char-tab is-active" data-view="daisy" aria-pressed="true">
        <span>🌼</span><span>蓝巾小柴</span>
      </button>
      <button type="button" class="char-tab" data-view="kuro" aria-pressed="false">
        <span>🖤</span><span>歪头黑柴</span>
      </button>
      <button type="button" class="char-tab" data-view="sunny" aria-pressed="false">
        <span>🕶️</span><span>墨镜金毛</span>
      </button>
    </nav>

    <div class="state-bar" role="group" aria-label="切换小狗状态">
      <span class="bar-label">状态</span>
      <button type="button" class="state-btn is-active" data-state="normal" aria-pressed="true" title="默认待机状态（正常响应键鼠与摸头，静置15秒自动犯困）">
        <span>🐶</span><span>默认</span>
      </button>
      <button type="button" class="state-btn" data-state="happy" aria-pressed="false" title="切换开心笑柴状态（弯弯笑眼 + 害羞腮红 + 吐舌大笑）">
        <span>😄</span><span>开心</span>
      </button>
      <button type="button" class="state-btn" data-state="drool" aria-pressed="false" title="切换馋嘴流口水状态（张嘴期待 + 口水滴 + 墨镜金毛星星眼）">
        <span>🤤</span><span>馋嘴</span>
      </button>
      <button type="button" class="state-btn" data-state="sleepy" aria-pressed="false" title="切换犯困打瞌睡状态（打哈欠犯困吹鼻涕泡，再点立即熟睡，敲键/点击即可戳醒）">
        <span>💤</span><span>犯困</span>
      </button>
      <button type="button" class="state-btn" data-state="overdrive" aria-pressed="false" title="切换狂暴暴走状态（怒目咬牙 + 暴起青筋 + 大汗淋漓 + 火焰气场 + RGB 彩虹键盘）">
        <span>🔥</span><span>狂暴</span>
      </button>
    </div>

    <div class="treat-bar" aria-label="投喂零食罐">
      <span class="treat-label">投喂</span>
      <button type="button" class="treat-btn" data-treat="bone" title="拖拽或点击拿起香脆骨头喂给小狗">
        <span>🦴</span><span>骨头</span>
      </button>
      <button type="button" class="treat-btn" data-treat="jerky" title="拖拽或点击拿起炭烤肉干喂给小狗">
        <span>🥩</span><span>肉干</span>
      </button>
      <button type="button" class="treat-btn" data-treat="cheese" title="拖拽或点击拿起芝士球喂给小狗">
        <span>🧀</span><span>芝士</span>
      </button>
    </div>

    <div class="hud-actions">
      <button type="button" class="hud-btn" id="deskDirBtn" aria-pressed="true" title="切换键鼠朝向：面向狗狗（鼠标在左）/ 面向主人（鼠标在右）">
        <span id="deskDirIcon">🐶</span><span id="deskDirLabel">面向狗狗</span>
      </button>
      <button type="button" class="hud-btn" id="soundToggle" aria-pressed="false" title="开启或关闭敲键/投喂/气泡音效">
        <span id="soundIcon">🔇</span><span id="soundLabel">音效关</span>
      </button>
      <button type="button" class="hud-btn" id="themeToggle" aria-pressed="false" title="切换浅色/深色背景">
        <span id="themeIcon">☀️</span><span id="themeLabel">浅色</span>
      </button>
      <button type="button" class="hud-btn" id="exportBtn" title="导出透明背景 PNG">
        <span>📸</span><span>导出 PNG</span>
      </button>
    </div>
  </header>

  <canvas id="petCanvas"></canvas>

  <!-- Shared Web Right-Click Dropdown Menu (mirrors Tauri native menu commands) -->
  <div class="pet-context-menu" id="webContextMenu" role="menu" aria-label="小狗互动菜单">
    <div class="ctx-group-title">切换小狗</div>
    <button type="button" class="ctx-item" data-cmd-action="set-view" data-cmd-val="daisy">
      <span>🌼 蓝巾小柴</span><span class="ctx-check" data-chk-view="daisy">✓</span>
    </button>
    <button type="button" class="ctx-item" data-cmd-action="set-view" data-cmd-val="kuro">
      <span>🖤 歪头黑柴</span><span class="ctx-check" data-chk-view="kuro"></span>
    </button>
    <button type="button" class="ctx-item" data-cmd-action="set-view" data-cmd-val="sunny">
      <span>🕶️ 墨镜金毛</span><span class="ctx-check" data-chk-view="sunny"></span>
    </button>
    <div class="ctx-sep"></div>
    <div class="ctx-group-title">切换状态</div>
    <button type="button" class="ctx-item" data-cmd-action="set-state" data-cmd-val="normal">
      <span>🐶 默认待机</span><span class="ctx-check" data-chk-state="normal">✓</span>
    </button>
    <button type="button" class="ctx-item" data-cmd-action="set-state" data-cmd-val="happy">
      <span>😄 开心笑柴</span><span class="ctx-check" data-chk-state="happy"></span>
    </button>
    <button type="button" class="ctx-item" data-cmd-action="set-state" data-cmd-val="drool">
      <span>🤤 馋嘴流口水</span><span class="ctx-check" data-chk-state="drool"></span>
    </button>
    <button type="button" class="ctx-item" data-cmd-action="set-state" data-cmd-val="sleepy">
      <span>💤 犯困吹鼻涕泡</span><span class="ctx-check" data-chk-state="sleepy"></span>
    </button>
    <button type="button" class="ctx-item" data-cmd-action="set-state" data-cmd-val="overdrive">
      <span>🔥 狂暴连击</span><span class="ctx-check" data-chk-state="overdrive"></span>
    </button>
    <div class="ctx-sep"></div>
    <div class="ctx-group-title">趣味互动</div>
    <button type="button" class="ctx-item" data-cmd-action="feed" data-cmd-val="bone"><span>🦴 喂香脆肉骨头</span></button>
    <button type="button" class="ctx-item" data-cmd-action="feed" data-cmd-val="jerky"><span>🥩 喂炭烤小肉干</span></button>
    <button type="button" class="ctx-item" data-cmd-action="feed" data-cmd-val="cheese"><span>🧀 喂芝士奶球</span></button>
    <button type="button" class="ctx-item" data-cmd-action="pet-head" data-cmd-val=""><span>💕 摸摸头夸夸</span></button>
    <div class="ctx-sep"></div>
    <div class="ctx-group-title">键鼠朝向</div>
    <button type="button" class="ctx-item" data-cmd-action="set-desk-dir" data-cmd-val="dog">
      <span>🐶 面向狗狗（鼠标在左）</span><span class="ctx-check" data-chk-desk="dog">✓</span>
    </button>
    <button type="button" class="ctx-item" data-cmd-action="set-desk-dir" data-cmd-val="user">
      <span>👀 面向主人（鼠标在右）</span><span class="ctx-check" data-chk-desk="user"></span>
    </button>
    <div class="ctx-sep"></div>
    <button type="button" class="ctx-item" data-cmd-action="toggle-sound" data-cmd-val="">
      <span>🔊 互动音效</span><span class="ctx-check" id="ctxChkSound"></span>
    </button>
    <button type="button" class="ctx-item" data-cmd-action="toggle-popups" data-cmd-val="">
      <span>⌨️ 按键放大气泡</span><span class="ctx-check" id="ctxChkPopups">✓</span>
    </button>
    <button type="button" class="ctx-item" data-cmd-action="toggle-theme" data-cmd-val="">
      <span>🌓 切换深浅背景</span>
    </button>
    <button type="button" class="ctx-item" data-cmd-action="export-png" data-cmd-val="">
      <span>📸 导出透明 PNG</span>
    </button>
  </div>

  <footer class="hud-bottom">
    <span id="statusHint">右键打开菜单 · 空格键让尾巴敲键 · 拖零食投喂 🦴 · 摸摸头变笑柴 💕 · 连续敲键狂暴连击 🔥</span>
    <span class="divider"></span>
    <span>互动计数 <strong id="actionCount">0</strong></span>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
