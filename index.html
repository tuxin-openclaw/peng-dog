<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>小狗键鼠桌宠 · Canvas 互动展示</title>
  <style>
    :root {
      --bg-page: #f4f7fc;
      --hud-bg: rgba(255, 255, 255, 0.86);
      --hud-border: rgba(140, 168, 204, 0.28);
      --hud-shadow: 0 10px 30px rgba(48, 76, 118, 0.1);
      --text-main: #2c3545;
      --text-muted: #69778c;
      --tab-active-bg: #3b82f6;
      --tab-active-text: #ffffff;
      --tab-hover-bg: rgba(59, 130, 246, 0.1);
      --treat-hover-bg: rgba(245, 158, 11, 0.15);
      --treat-active-bg: #f59e0b;
      --treat-active-text: #ffffff;
    }

    body.theme-dark {
      --bg-page: #151922;
      --hud-bg: rgba(28, 34, 46, 0.88);
      --hud-border: rgba(255, 255, 255, 0.12);
      --hud-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
      --text-main: #eef2f8;
      --text-muted: #9aa6ba;
      --tab-active-bg: #60a5fa;
      --tab-active-text: #101826;
      --tab-hover-bg: rgba(96, 165, 250, 0.15);
      --treat-hover-bg: rgba(251, 191, 36, 0.18);
      --treat-active-bg: #fbbf24;
      --treat-active-text: #1f1605;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-page);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
    }

    #petCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: default;
    }

    .hud-top {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: max-content;
      max-width: calc(100vw - 20px);
    }

    .char-switcher,
    .treat-bar,
    .hud-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px;
      border-radius: 999px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      box-shadow: var(--hud-shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .treat-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 6px 0 9px;
      white-space: nowrap;
    }

    .char-tab,
    .treat-btn,
    .hud-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-main);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
      white-space: nowrap;
    }

    .char-tab:hover,
    .hud-btn:hover {
      background: var(--tab-hover-bg);
    }

    .treat-btn {
      cursor: grab;
    }

    .treat-btn:hover {
      background: var(--treat-hover-bg);
      transform: translateY(-1px);
    }

    .char-tab:active,
    .treat-btn:active,
    .hud-btn:active {
      transform: scale(0.95);
    }

    .char-tab.is-active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      box-shadow: 0 3px 10px rgba(59, 130, 246, 0.28);
    }

    .treat-btn.is-active {
      background: var(--treat-active-bg);
      color: var(--treat-active-text);
      box-shadow: 0 3px 12px rgba(245, 158, 11, 0.36);
    }

    .hud-bottom {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      box-shadow: var(--hud-shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      max-width: calc(100vw - 24px);
      pointer-events: none;
    }

    .hud-bottom strong {
      color: var(--text-main);
      font-weight: 700;
    }

    .divider {
      width: 1px;
      height: 13px;
      background: var(--hud-border);
    }

    @media (max-width: 860px) {
      .char-tab, .treat-btn, .hud-btn {
        font-size: 12px;
        padding: 5px 9px;
      }
      .treat-label {
        display: none;
      }
      .hud-bottom {
        font-size: 12px;
        padding: 6px 14px;
      }
    }
  </style>
</head>
<body class="theme-light">
  <header class="hud-top">
    <nav class="char-switcher" aria-label="切换小狗形象">
      <button type="button" class="char-tab is-active" data-view="all" aria-pressed="true">
        <span>🐾</span><span>三只同框</span>
      </button>
      <button type="button" class="char-tab" data-view="sunny" aria-pressed="false">
        <span>🕶️</span><span>墨镜金毛</span>
      </button>
      <button type="button" class="char-tab" data-view="daisy" aria-pressed="false">
        <span>🌼</span><span>蓝巾小柴</span>
      </button>
      <button type="button" class="char-tab" data-view="kuro" aria-pressed="false">
        <span>🖤</span><span>歪头黑柴</span>
      </button>
    </nav>

    <div class="treat-bar" aria-label="投喂零食罐">
      <span class="treat-label">投喂</span>
      <button type="button" class="treat-btn" data-treat="bone" title="拖拽或点击拿起香脆骨头喂给小狗">
        <span>🦴</span><span>骨头</span>
      </button>
      <button type="button" class="treat-btn" data-treat="jerky" title="拖拽或点击拿起炭烤肉干喂给小狗">
        <span>🥩</span><span>肉干</span>
      </button>
      <button type="button" class="treat-btn" data-treat="cheese" title="拖拽或点击拿起芝士球喂给小狗">
        <span>🧀</span><span>芝士</span>
      </button>
    </div>

    <div class="hud-actions">
      <button type="button" class="hud-btn" id="napBtn" title="让小狗打哈欠犯困吹鼻涕泡（静置15秒也会自动打瞌睡，敲键/点击即可戳醒！）">
        <span>💤</span><span>犯困</span>
      </button>
      <button type="button" class="hud-btn" id="soundToggle" aria-pressed="false" title="开启或关闭敲键/投喂/气泡音效">
        <span id="soundIcon">🔇</span><span id="soundLabel">音效关</span>
      </button>
      <button type="button" class="hud-btn" id="themeToggle" aria-pressed="false" title="切换浅色/深色背景">
        <span id="themeIcon">☀️</span><span id="themeLabel">浅色</span>
      </button>
      <button type="button" class="hud-btn" id="exportBtn" title="导出透明背景 PNG">
        <span>📸</span><span>导出 PNG</span>
      </button>
    </div>
  </header>

  <canvas id="petCanvas"></canvas>

  <footer class="hud-bottom">
    <span id="statusHint">拖零食投喂 🦴 · 摸摸头变笑柴 💕 · 连续敲键触发狂暴连击 🔥 · 静置自动打瞌睡 💤</span>
    <span class="divider"></span>
    <span>互动计数 <strong id="actionCount">0</strong></span>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
